<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto</title>
  <meta name="robots" content="noindex">
  <script>(function () { var d = { nexo: "nexo-erp.html", servicoflow: "servicoflow.html" }[(location.search.match(/[?&]p=([a-z]+)/) || [])[1]]; if (d) location.replace(d); })();</script>
  <meta name="theme-color" content="#12122a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css?v=a45f4674d25d">
</head>
<body>
  <header class="topo">
    <div class="wrap topo-in">
      <a class="marca" href="index.html"><span class="marca-ponto"></span><span data-nome>Vem Site</span></a>
      <a class="btn btn-sm" href="index.html#montar">Montar meu site</a>
    </div>
  </header>

  <main class="pagina">
    <div class="wrap" id="projeto"></div>
    <noscript><p class="wrap">Ative o JavaScript para ver as telas do projeto ou <a href="index.html#trabalhos">volte aos trabalhos</a>. Você também pode falar com a gente em <a href="mailto:vemsitecontato@gmail.com">vemsitecontato@gmail.com</a>.</p></noscript>
  </main>

  <footer class="rodape">
    <div class="wrap rodape-in">
      <span>© <span id="ano"></span> <span data-nome></span></span>
      <span class="rodape-links"><a href="privacidade.html">Política de privacidade</a></span>
    </div>
  </footer>

  <script src="config.js?v=136db5ee89af"></script>
  <script src="contato.js?v=27c9730acdba"></script>
  <script src="modelos.js?v=def1521ce154"></script>
  <script>
    (function () {
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const wa = CONTATO.url;
      document.querySelectorAll("[data-nome]").forEach((el) => (el.textContent = CONFIG.nome));
      document.getElementById("ano").textContent = new Date().getFullYear();

      const p = TRABALHOS.find((t) => t.id && t.id === new URLSearchParams(location.search).get("p"));
      const caixa = document.getElementById("projeto");
      if (!p) {
        caixa.innerHTML = `<a class="voltar" href="index.html#modelos">← Voltar aos projetos</a><h1>Projeto não encontrado</h1>`;
        return;
      }
      document.title = p.nome + " · " + CONFIG.nome;
      const tela = (t) => `<figure class="tela${t.cel ? " cel" : ""}"><button type="button" class="tela-moldura tela-abrir" data-i="${p.telas.indexOf(t)}" aria-label="Ampliar: ${esc(t.legenda)}"><img src="${esc(t.src)}" alt="${esc(t.legenda)}" loading="lazy"></button><figcaption>${esc(t.legenda)}</figcaption></figure>`;
      const largas = p.telas.filter((t) => !t.cel);
      const cels = p.telas.filter((t) => t.cel);
      caixa.innerHTML = `
        <a class="voltar" href="index.html#modelos">← Voltar aos projetos</a>
        <div><span class="proj-tipo">${esc(p.tipo)}</span></div>
        <h1>${esc(p.nome)}</h1>
        <p class="sub">${esc(p.desc)}</p>
        <h2 class="oculto">Como funciona</h2>
        <ul class="proj-pontos">${p.pontos.map((x) => `<li><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></li>`).join("")}</ul>
        <h2>No computador</h2>
        <div class="telas">${largas.map(tela).join("")}</div>
        ${cels.length ? `<h2>No celular</h2><div class="telas telas-cel">${cels.map(tela).join("")}</div>` : ""}
        <div class="acoes">
          <a class="btn" target="_blank" rel="noopener" href="${esc(wa("Olá! Vi o projeto " + p.nome + " e quero um sistema parecido."))}">Quero um sistema assim</a>
        </div>`;

      // Ampliação: clicar numa tela abre a imagem inteira, com setas para passar.
      const lb = document.createElement("dialog");
      lb.className = "lb";
      lb.setAttribute('aria-label', 'Capturas do projeto ' + p.nome);
      lb.setAttribute('aria-describedby', 'galeriaLegenda');
      const icone = (caminho) => `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="${caminho}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      lb.innerHTML = `<button type="button" class="lb-x" aria-label="Fechar">${icone('M6 6l12 12M18 6L6 18')}</button>
        <figure><div class="lb-midia"><div class="lb-rolo"><img alt=""></div>
          <button type="button" class="lb-nav lb-ant" aria-label="Tela anterior">${icone('M14 5l-7 7 7 7')}</button>
          <button type="button" class="lb-nav lb-prox" aria-label="Próxima tela">${icone('M10 5l7 7-7 7')}</button>
        </div><figcaption id="galeriaLegenda" aria-live="polite"></figcaption></figure>`;
      document.body.appendChild(lb);
      let atual = 0;
      const mostrar = (i) => {
        atual = (i + p.telas.length) % p.telas.length;
        const t = p.telas[atual];
        const img = lb.querySelector("img");
        img.src = t.src;
        img.alt = t.legenda;
        lb.classList.toggle("lb-cel", !!t.cel);
        lb.querySelector("figcaption").textContent = `${t.legenda} (${atual + 1} de ${p.telas.length})`;
        lb.querySelector(".lb-rolo").scrollTop = 0;
      };
      caixa.addEventListener("click", (ev) => {
        const b = ev.target.closest(".tela-abrir");
        if (!b) return;
        mostrar(Number(b.dataset.i));
        lb.showModal();
        document.body.classList.add('galeria-aberta');
      });
      lb.addEventListener('close', () => document.body.classList.remove('galeria-aberta'));
      lb.querySelector(".lb-x").addEventListener("click", () => lb.close());
      lb.querySelector(".lb-ant").addEventListener("click", () => mostrar(atual - 1));
      lb.querySelector(".lb-prox").addEventListener("click", () => mostrar(atual + 1));
      lb.addEventListener("click", (ev) => { if (ev.target === lb) lb.close(); });
      lb.addEventListener("keydown", (ev) => {
        if (ev.key === "ArrowLeft") { ev.preventDefault(); mostrar(atual - 1); }
        if (ev.key === "ArrowRight") { ev.preventDefault(); mostrar(atual + 1); }
      });
    })();
  </script>
</body>
</html>
